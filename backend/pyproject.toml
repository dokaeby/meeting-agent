[project]
name = "meeting-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "email-validator>=2.2", "python-multipart>=0.0.20", "argon2-cffi>=23", "cryptography>=44", "httpx>=0.28", "celery>=5.4", "redis>=5", "reportlab>=4", "tzdata>=2025"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12", "pypdf>=5"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires PG_TEST_URL with separate runtime role"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

